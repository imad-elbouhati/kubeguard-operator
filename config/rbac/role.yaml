---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - platform.demo
  resources:
  - guardpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.demo
  resources:
  - guardpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - platform.demo
  resources:
  - guardpolicies/status
  verbs:
  - get
  - patch
  - update
